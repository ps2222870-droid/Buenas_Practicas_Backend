body[data-tipo="portada"]::before,body[data-tipo="seccion"]::before,body[data-tipo="cierre"]::before{content:'';position:fixed;inset:0;z-index:0;
  background:linear-gradient(100deg,rgba(4,20,38,.92) 0%,rgba(4,20,38,.66) 55%,rgba(4,20,38,.34) 100%)}
body[data-tipo="cierre"]::before{background:linear-gradient(80deg,rgba(4,20,38,.40) 0%,rgba(4,20,38,.72) 50%,rgba(4,20,38,.93) 100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}

/* ---------- Firma institucional: franja tricolor oficial ---------- */
.tricolor{position:fixed;top:0;left:0;right:0;height:6px;z-index:60;display:flex}
.tricolor span:nth-child(1){flex:5;background:var(--amarillo)}
.tricolor span:nth-child(2){flex:1.4;background:var(--azul)}
.tricolor span:nth-child(3){flex:1;background:var(--rojo)}

/* ---------- Cabecera ---------- */
header.marco{display:flex;justify-content:space-between;align-items:center;
  padding:24px 56px 12px;flex:0 0 auto;z-index:5}
.brand{display:flex;align-items:center;gap:14px;font-family:var(--f-display);
  font-weight:800;font-size:17px;letter-spacing:.01em;color:var(--azul)}
.brand b{color:var(--rojo)}
.brand img.logo{height:48px;width:48px;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 4px 14px rgba(0,32,66,.20);background:#fff}
.brand small{display:block;font-weight:600;font-size:10px;letter-spacing:.3em;
  color:var(--texto-tenue);text-transform:uppercase;margin-top:3px}
.emblema{flex:0 0 48px;height:48px;border-radius:50%;background:#fff;
  display:grid;place-items:center;border:1px solid var(--linea);
  box-shadow:0 4px 14px rgba(0,32,66,.12);overflow:hidden}
.emblema svg{display:block;width:88%;height:88%}
.tag-derecha{display:flex;align-items:center}
.tag-derecha .pill{background:var(--azul);color:#fff;font-family:var(--f-mono);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  padding:9px 18px;border-radius:100px;white-space:nowrap}
.tag-derecha .dots{width:10px;height:10px;border-radius:50%;background:var(--amarillo);
  box-shadow:18px 0 0 var(--azul),36px 0 0 var(--rojo);margin:0 40px 0 20px}

/* ---------- Pie ---------- */
footer.marco{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:0 56px 18px;flex:0 0 auto;font-family:var(--f-mono);
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--texto-tenue)}
footer .contador b{color:var(--rojo);letter-spacing:.1em;font-size:12px}

/* ---------- Barra de progreso ---------- */
#progreso{position:fixed;bottom:0;left:0;right:0;height:5px;background:#EBEEF2;z-index:60}
#progreso-fill{height:100%;width:0;background:linear-gradient(90deg,var(--amarillo) 55%,var(--rojo));
  transition:width .45s cubic-bezier(.22,.9,.3,1)}
body[data-tipo="portada"] #progreso,body[data-tipo="seccion"] #progreso,body[data-tipo="cierre"] #progreso{background:rgba(255,255,255,.14)}

/* ---------- Escenario ---------- */
#escenario{flex:1;min-height:0;padding:6px 56px 16px;display:flex;overflow:hidden}
.slide{flex:1;display:flex;flex-direction:column;min-height:0;animation:entrada .5s cubic-bezier(.2,.8,.25,1) both}
@keyframes entrada{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .slide,.card,.panel,.fila-tabla{animation:none!important}
  #progreso-fill{transition:none}
  .diagrama-wrap svg *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}
}

/* Etiqueta amarilla de sección — como en la plantilla oficial */
.eyebrow{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;
  background:var(--amarillo);color:var(--texto);font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;
  padding:8px 16px 8px 12px;border-radius:3px;margin-bottom:20px;
  box-shadow:0 3px 10px rgba(253,200,0,.35)}
.eyebrow::before{content:'';width:9px;height:9px;background:var(--rojo);flex:0 0 auto}
h1.titulo{font-family:var(--f-display);font-weight:800;line-height:1.05;letter-spacing:-.02em;
  font-size:clamp(30px,4.4vw,56px);max-width:22ch;color:var(--azul)}
h1.titulo i{font-style:normal;color:var(--rojo)}
p.bajada{margin-top:18px;max-width:80ch;font-size:clamp(14px,1.3vw,17.5px);
  color:var(--texto-suave);line-height:1.55}

/* ---------- Portada / cierre (fondo fotográfico oscuro oficial) ---------- */
.slide.portada,.slide.seccion{justify-content:center}
.slide.portada .titulo,.slide.seccion .titulo{color:#fff;font-size:clamp(40px,6.2vw,84px);max-width:17ch}
.slide.portada .titulo i,.slide.seccion .titulo i{color:var(--amarillo)}
.slide.portada .bajada,.slide.seccion .bajada{color:#D9E3EC;font-size:clamp(15px,1.55vw,20px)}
.slide.portada .eyebrow,.slide.seccion .eyebrow{box-shadow:0 3px 14px rgba(0,0,0,.4)}
.chips{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.45);border-radius:100px;padding:9px 18px;color:#E7EEF4}
.chip.solido{background:var(--amarillo);border-color:var(--amarillo);color:var(--texto);font-weight:700}
.portada .logo-grande{margin-bottom:34px;display:flex;align-items:center;gap:18px}
.portada .logo-grande img.logo{height:88px;width:88px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.portada .logo-grande .emblema{flex-basis:80px;height:80px;border:none}
.portada .logo-grande .nombre-inst{font-family:var(--f-display);font-weight:700;
  font-size:19px;line-height:1.25;color:#C7D5E1}
.portada .logo-grande .nombre-inst b{color:#fff}
body[data-tipo="portada"] .brand,body[data-tipo="seccion"] .brand,body[data-tipo="cierre"] .brand{color:#fff}
body[data-tipo="portada"] .brand b,body[data-tipo="seccion"] .brand b,body[data-tipo="cierre"] .brand b{color:var(--amarillo)}
body[data-tipo="portada"] .brand small,body[data-tipo="seccion"] .brand small,body[data-tipo="cierre"] .brand small{color:#9DB2C4}
body[data-tipo="portada"] footer.marco,body[data-tipo="seccion"] footer.marco,body[data-tipo="cierre"] footer.marco{color:#9DB2C4}
body[data-tipo="portada"] .tag-derecha .pill,body[data-tipo="seccion"] .tag-derecha .pill,body[data-tipo="cierre"] .tag-derecha .pill{
  background:var(--amarillo);color:var(--texto)}
body[data-tipo="portada"] .tag-derecha .dots,body[data-tipo="seccion"] .tag-derecha .dots,body[data-tipo="cierre"] .tag-derecha .dots{
  box-shadow:18px 0 0 #fff,36px 0 0 var(--rojo)}

/* ---------- Rejillas de contenido ---------- */
.contenido{flex:1;min-height:0;display:flex;flex-direction:column}
.grid{display:grid;gap:20px;margin-top:26px;flex:1;min-height:0;align-content:start}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.card,.panel{background:var(--panel);border:1px solid var(--linea);border-top:4px solid var(--amarillo);
  border-radius:14px;padding:26px 26px 28px;box-shadow:var(--sombra);
  animation:entrada .55s cubic-bezier(.2,.8,.25,1) both;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover,.panel:hover{transform:translateY(-4px);border-top-color:var(--rojo);
  box-shadow:0 18px 44px rgba(0,32,66,.14)}
.grid > *:nth-child(1){animation-delay:.05s}
.grid > *:nth-child(2){animation-delay:.13s}
.grid > *:nth-child(3){animation-delay:.21s}
.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--rojo);font-weight:700;margin-bottom:14px}
.card h3,.panel h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;
  font-size:clamp(19px,1.85vw,26px);margin-bottom:12px;color:var(--azul)}
.card p,.panel p{color:var(--texto-suave);font-size:clamp(13px,1.12vw,15.5px);line-height:1.6}
.panel p + p{margin-top:12px}
.panel p b,.card p b{color:var(--texto)}

/* ---------- Tablas ---------- */
.tabla-wrap{margin-top:26px;flex:1;min-height:0;overflow:auto;border:1px solid var(--linea);
  border-radius:14px;background:#fff;box-shadow:var(--sombra)}
table{width:100%;border-collapse:collapse;font-size:clamp(12.5px,1.08vw,15px)}
thead th{position:sticky;top:0;background:var(--azul);color:var(--amarillo);
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  text-align:left;padding:14px 20px}
tbody td{padding:13px 20px;border-bottom:1px solid #EDF1F5;color:var(--texto-suave);
  line-height:1.5;vertical-align:top}
tbody tr:nth-child(even) td{background:#FAFBFC}
tbody tr:last-child td{border-bottom:none}
tbody td:first-child{color:var(--azul);font-weight:700;white-space:nowrap}
tbody tr:hover td{background:#FFF8DE}
tr.destacada td{background:rgba(253,200,0,.14)!important;color:var(--texto)}
tr.destacada td:first-child{color:var(--rojo)}

/* ---------- Diagramas (estilo pizarra / infografía) ---------- */
.diagrama-wrap{margin-top:20px;flex:1;min-height:0;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
  animation:entrada .55s cubic-bezier(.2,.8,.25,1) .08s both}
.diagrama-wrap svg{width:100%;height:100%;max-width:1080px;
  filter:drop-shadow(0 8px 22px rgba(0,32,66,.08))}
.diagrama-wrap text{font-family:var(--f-cuerpo)}
.diagrama-wrap svg :is(line,polyline,polygon,path,rect,circle,ellipse)[stroke]:not([stroke-dasharray]){
  stroke-dasharray:2400;stroke-dashoffset:2400;animation:trazo 1.25s ease-out forwards}
.diagrama-wrap svg text{opacity:0;animation:aparece .55s ease .7s forwards}
@keyframes trazo{to{stroke-dashoffset:0}}
@keyframes aparece{to{opacity:1}}

/* ---------- Quiz ---------- */
.slide.quiz .contenido{flex-direction:row;gap:56px;align-items:center;margin-top:8px}
.quiz-izq{flex:0 0 34%}
.quiz-izq .titulo{font-size:clamp(34px,4.6vw,64px)}
.quiz-der{flex:1;background:#fff;border:1px solid var(--linea);border-top:5px solid var(--amarillo);
  border-radius:18px;padding:32px 34px;box-shadow:var(--sombra)}
.quiz-der .pregunta{font-family:var(--f-display);font-weight:700;color:var(--azul);
  font-size:clamp(16px,1.5vw,21px);line-height:1.4;margin-bottom:22px}
.opcion{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
  background:#fff;border:1.5px solid #DCE3EA;border-radius:12px;
  padding:14px 18px;margin-bottom:12px;color:var(--texto-suave);cursor:pointer;
  font:inherit;font-size:clamp(13px,1.12vw,15.5px);line-height:1.5;
  transition:border-color .2s,background .2s,transform .15s}
.opcion:hover:not(:disabled){border-color:var(--amarillo);background:#FFFBEB;transform:translateX(4px)}
.opcion:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.opcion .letra{flex:0 0 28px;height:28px;border-radius:50%;background:var(--amarillo);
  color:var(--texto);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.opcion:disabled{cursor:default;opacity:.92}
.opcion.correcta{border-color:var(--verde-ok);background:#EDF9F2;color:var(--texto)}
.opcion.correcta .letra{background:var(--verde-ok);color:#fff}
.opcion.incorrecta{border-color:var(--rojo);background:#FCEFEF}
.opcion.incorrecta .letra{background:var(--rojo);color:#fff}
.feedback{display:none;margin-top:8px;padding:16px 18px;border-radius:12px;font-size:14px;line-height:1.55}
.feedback.visible{display:block;animation:entrada .35s ease both}
.feedback.ok{background:#EDF9F2;border:1px solid #9ADCBB;color:#14532D}
.feedback.mal{background:#FCEFEF;border:1px solid #EBB4B6;color:#7F1D1D}

/* ---------- Cierre ---------- */
.marcador{display:flex;gap:26px;margin-top:36px;flex-wrap:wrap}
.marcador .stat{border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:22px 30px;
  min-width:170px;background:rgba(4,20,38,.35);backdrop-filter:blur(4px)}
.marcador .stat b{display:block;font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--amarillo)}
.marcador .stat span{font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:#B9C6D2}
.slide.seccion .bajada b{color:var(--amarillo)!important}

/* ---------- Controles ---------- */
.controles{position:fixed;right:26px;bottom:26px;display:flex;gap:10px;z-index:70}
.btn{width:46px;height:46px;border-radius:12px;border:1.5px solid #D5DDE4;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);color:var(--azul);
  font-size:18px;cursor:pointer;display:grid;place-items:center;transition:all .2s;
  box-shadow:0 6px 18px rgba(0,32,66,.12)}
.btn:hover{border-color:var(--rojo);color:var(--rojo);transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

#indice.abierto{display:block;animation:entrada .25s ease both}
#indice h2{font-family:var(--f-display);font-size:30px;font-weight:800;margin-bottom:8px;color:#fff}
#indice h2 i{font-style:normal;color:var(--amarillo)}
#indice .ayuda{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:#8FA6B8;margin-bottom:34px}
.ind-grupo{margin-bottom:26px}
.ind-grupo h4{display:inline-flex;align-items:center;gap:8px;background:var(--amarillo);color:var(--texto);
  font-family:var(--f-mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  font-weight:700;padding:6px 12px;border-radius:3px;margin-bottom:12px}
.ind-grupo h4::before{content:'';width:7px;height:7px;background:var(--rojo)}
.ind-grupo ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.ind-grupo button{width:100%;text-align:left;background:none;border:1px solid transparent;
  border-radius:8px;padding:9px 12px;color:#C7D5E1;font:inherit;font-size:14px;cursor:pointer}
.ind-grupo button:hover{border-color:rgba(253,200,0,.55);color:#fff}
.ind-grupo button.actual{background:rgba(253,200,0,.15);color:var(--amarillo)}
.ind-grupo button span{font-family:var(--f-mono);font-size:11px;color:#7E97AA;margin-right:10px}

/* ---------- Actividades de clasificación (tipo nuevo) ---------- */
.clasif-grid{margin-top:22px;overflow:auto;padding-bottom:6px}
.clasif-card{background:#fff;border:1px solid var(--linea);border-top:4px solid var(--amarillo);
  border-radius:14px;padding:18px 18px 16px;box-shadow:var(--sombra);
  animation:entrada .5s cubic-bezier(.2,.8,.25,1) both}
.clasif-sit{font-size:clamp(12.5px,1.02vw,15px);color:var(--texto);font-weight:600;line-height:1.45}
.clasif-ops{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.clasif-btn{font:inherit;font-size:clamp(10.5px,.86vw,12.5px);padding:6px 12px;border-radius:100px;
  border:1.5px solid #DCE3EA;background:#fff;color:var(--texto-suave);cursor:pointer;
  transition:border-color .2s,background .2s,transform .15s}
.clasif-btn:hover:not(:disabled){border-color:var(--amarillo);background:#FFFBEB;transform:translateY(-1px)}
.clasif-btn:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.clasif-btn:disabled{cursor:default;opacity:.92}
.clasif-btn.ok{border-color:var(--verde-ok);background:#EDF9F2;color:#14532D;font-weight:700}
.clasif-btn.mal{border-color:var(--rojo);background:#FCEFEF;color:#7F1D1D}
.clasif-res{display:none;margin-top:10px;font-size:12.5px;line-height:1.45;border-radius:8px;padding:8px 11px}
.clasif-res.visible{display:block;animation:entrada .3s ease both}
.clasif-res.bien{background:#EDF9F2;border:1px solid #9ADCBB;color:#14532D}
.clasif-res.error{background:#FCEFEF;border:1px solid #EBB4B6;color:#7F1D1D}

/* ---------- Reflexión metacognitiva (cierre) ---------- */
.reflex textarea{width:100%;margin-top:8px;resize:vertical;border:1.5px solid #DCE3EA;border-radius:10px;
  padding:12px 14px;font:inherit;font-size:14px;color:var(--texto);background:#FBFCFD;line-height:1.5}
.reflex textarea:focus{outline:2px solid var(--azul);outline-offset:1px;background:#fff}

/* ---------- Diapositivas de sección: fondo oscuro para que el título blanco sea legible ---------- */
body[data-tipo="seccion"] .slide.seccion .bajada{max-width:78ch}

/* ---------- Capturas anotadas (tipo nuevo) ---------- */
.shot-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:24px;margin-top:20px;align-items:start}
.shot-fig{margin:0;min-height:0;height:100%;display:flex;align-items:flex-start;justify-content:center}
.shot-box{position:relative;display:inline-block;max-height:100%;border-radius:12px;overflow:hidden;
  border:1px solid var(--linea);box-shadow:var(--sombra);background:#fff;line-height:0}
.shot-box img{display:block;max-width:100%;max-height:calc(100vh - 330px);width:auto;height:auto}
.zona{position:absolute;border:2.5px solid var(--rojo);border-radius:8px;background:rgba(197,38,43,.06);
  cursor:pointer;padding:0;transition:background .2s,box-shadow .2s}
.zona span{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;
  background:var(--rojo);color:#fff;font:800 11.5px/22px var(--f-cuerpo);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.zona.activa{background:rgba(253,200,0,.28);border-color:var(--amarillo);box-shadow:0 0 0 4px rgba(253,200,0,.35)}
.zona.activa span{background:var(--amarillo);color:var(--texto)}
.shot-notas{list-style:none;overflow:auto;max-height:100%;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.nota{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);
  border-left:4px solid var(--amarillo);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;
  transition:border-color .2s,transform .15s}
.nota:hover,.nota.activa{border-left-color:var(--rojo);transform:translateX(3px);background:#FFFBEB}
.nota .num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--rojo);color:#fff;font-weight:800;
  font-size:12px;display:grid;place-items:center}
.nota .nt{display:block;color:var(--azul);font-size:clamp(13px,1.05vw,15px)}
.nota small{display:block;color:var(--texto-suave);font-size:clamp(12px,.95vw,13.5px);line-height:1.45;margin-top:2px}

/* ---------- Cuaderno simulado (tipo nuevo) ---------- */
.nb-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:22px;margin-top:20px}
.nb{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.nb-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--linea);
  background:#F6F8FA;font-size:13.5px;color:var(--texto)}
.nb-ico{color:var(--amarillo);font-size:18px}
.nb-sim{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--texto-tenue);border:1px solid var(--linea);border-radius:100px;padding:3px 10px}
.nb-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.nb-cell{border:1px solid #DCE3EA;border-radius:10px;overflow:hidden}
.nb-in{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#FAFBFC}
.nb-n{font-family:var(--f-mono);font-size:12px;color:var(--texto-tenue);padding-top:5px;min-width:30px}
.nb-run{flex:0 0 26px;height:26px;border-radius:50%;border:none;background:#262626;color:#fff;font-size:10px;
  cursor:pointer;margin-top:1px;transition:background .2s}
.nb-run:hover{background:var(--rojo)}
.nb-code{flex:1;margin:0;font-family:var(--f-mono);font-size:clamp(12.5px,1.05vw,15px);line-height:1.6;
  color:#262626;white-space:pre-wrap;word-break:break-word;padding-top:2px}
.py-kw{color:#8F2AA8;font-weight:600}.py-fn{color:#0F5FA0;font-weight:600}.py-st{color:#1A7F37}
.py-nu{color:#B35900}.py-cm{color:#8A94A0;font-style:italic}.py-op{color:#C5262B;font-weight:700}
.nb-out{border-top:1px solid #E8EDF2;padding:10px 14px 12px 78px;background:#fff;position:relative}
.nb-out pre{margin:0;font-family:var(--f-mono);font-size:clamp(12px,1vw,14px);line-height:1.6;
  white-space:pre-wrap;word-break:break-word;color:#262626}
.nb-out.err pre{color:#A3191E;background:#FDF1F1;border-radius:6px;padding:8px 10px}
.nb-out.oculta pre{filter:blur(7px);user-select:none;opacity:.45}
.nb-out:not(.oculta) .nb-revelar{display:none}
.nb-revelar{position:absolute;inset:8px 14px 8px 78px;z-index:2;border:2px dashed var(--amarillo);border-radius:8px;
  background:rgba(255,251,235,.9);color:var(--texto);font:700 13px var(--f-cuerpo);cursor:pointer}
.nb-revelar:hover{background:#FFF3C4}
.tecleado{background:#FFF3C4;border-bottom:2px solid var(--amarillo);padding:0 3px;border-radius:3px;font-weight:700}
.nb-texto{display:grid;grid-template-columns:1fr 1fr}
.nb-src{padding:10px 12px;background:#FAFBFC;border-right:1px solid #E8EDF2}
.nb-src pre{margin:6px 0 0;font-family:var(--f-mono);font-size:clamp(11.5px,.95vw,13.5px);line-height:1.6;white-space:pre-wrap;color:#57616B}
.nb-render{padding:10px 16px;font-size:clamp(13px,1.05vw,15px);line-height:1.5}
.nb-render h3{font-family:var(--f-display);color:var(--azul);font-size:clamp(17px,1.5vw,21px);margin:4px 0 8px}
.nb-render p{color:var(--texto-suave);margin:2px 0}
.nb-tag{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--texto-tenue)}
.nb-notas{overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.nb-nota{background:#fff;border:1px solid var(--linea);border-top:3px solid var(--amarillo);border-radius:12px;
  padding:12px 16px;box-shadow:0 6px 18px rgba(0,32,66,.06)}
.nb-nota .k{margin-bottom:6px}
.nb-nota h4{font-family:var(--f-display);color:var(--azul);font-size:clamp(14px,1.2vw,17px);margin-bottom:4px}
.nb-nota p{color:var(--texto-suave);font-size:clamp(12.5px,1vw,14px);line-height:1.5}
code{font-family:var(--f-mono);font-size:.92em;background:rgba(0,65,105,.07);padding:1px 5px;border-radius:4px;color:var(--azul)}

/* ---------- Preguntas orientadoras (tipo nuevo) ---------- */
.preg-lista{flex:1;min-height:0;overflow:auto;margin-top:22px;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.preg{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--amarillo);border-radius:12px;
  padding:14px 18px;box-shadow:0 6px 18px rgba(0,32,66,.06);animation:entrada .45s ease both}
.preg-q{display:flex;gap:14px;align-items:flex-start}
.preg-n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--azul);color:var(--amarillo);font-weight:800;display:grid;place-items:center}
.preg-q p{font-family:var(--f-display);font-weight:700;color:var(--texto);font-size:clamp(14.5px,1.3vw,18px);line-height:1.4;padding-top:3px}
.preg-btn{margin:10px 0 0 44px;font:700 12px var(--f-cuerpo);color:var(--azul);background:rgba(0,65,105,.06);
  border:1px solid rgba(0,65,105,.18);border-radius:100px;padding:6px 14px;cursor:pointer}
.preg-btn:hover{background:#FFFBEB;border-color:var(--amarillo)}
.preg-a{display:none;margin:10px 0 0 44px;padding:10px 14px;border-radius:10px;background:#EDF9F2;
  border:1px solid #9ADCBB;color:#14532D;font-size:clamp(13px,1.05vw,15px);line-height:1.55}
.preg-a.visible{display:block;animation:entrada .3s ease both}

/* ---------- Nota para el docente ---------- */
.nota-docente{flex:0 0 auto;margin-top:12px;border:1px dashed #C3CED8;border-radius:10px;background:rgba(255,255,255,.92);
  font-size:13.5px;color:var(--texto-suave);max-width:100%}
.nota-docente summary{cursor:pointer;padding:7px 14px;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--azul);font-weight:700;list-style:none}
.nota-docente summary::-webkit-details-marker{display:none}
.nota-docente summary::before{content:'▸  ';color:var(--rojo)}
.nota-docente[open] summary::before{content:'▾  '}
.nota-docente div{padding:0 16px 12px;line-height:1.55}
.slide.quiz .nota-docente{position:absolute;left:56px;right:56px;bottom:46px}
.clasif-sit code{font-size:.95em}
.nb-wrap,.shot-wrap{align-items:start}
.nb{max-height:100%}
.nb-notas{max-height:100%}
.tabla-wrap{flex:0 1 auto}
.nota-docente{max-width:calc(100% - 230px)}

/* ---------- Editor de código estilo VS Code ---------- */
.ed-col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.ed{background:#1E1E1E;border-radius:12px;overflow:hidden;box-shadow:var(--sombra);border:1px solid #2D2D2D;flex:0 0 auto}
.ed-tabs{display:flex;background:#181818;border-bottom:1px solid #2B2B2B}
.ed-tab{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#1E1E1E;color:#E8E8E8;font-size:12.5px;
  font-style:italic;border-top:2px solid var(--amarillo)}
.ed-ico{width:12px;height:12px;border-radius:3px;display:inline-block;background:#E8C02B}
.ed-ico.ed-json{background:#8BC34A}.ed-ico.ed-env{background:#E8A33D}.ed-ico.ed-md{background:#42A5F5}
.ed-ico.ed-git{background:#F05033}.ed-ico.ed-sh{background:#9E9E9E}
.ed-ruta{padding:4px 16px;font-size:11.5px;color:#9D9D9D;background:#1E1E1E;font-family:var(--f-cuerpo)}
.ed-body{overflow:auto;padding:6px 0 10px}
.ed-code{border-collapse:collapse;font-family:var(--f-mono);font-size:clamp(12px,1.02vw,14.5px);line-height:1.62;color:#D4D4D4;width:100%}
.ed-code td{padding:0;vertical-align:top}
.ed-code .ln{width:44px;padding:0 14px 0 10px;text-align:right;color:#6E7681;user-select:none}
.ed-code .lc{white-space:pre-wrap;word-break:break-word;padding-right:14px}
.ed-code tr.res td{background:rgba(253,200,0,.13)}
.ed-code tr.res .ln{color:var(--amarillo);box-shadow:inset 3px 0 0 var(--amarillo)}
.cd-cm{color:#6A9955;font-style:italic}.cd-st{color:#CE9178}.cd-kw{color:#C586C0}.cd-nu{color:#B5CEA8}
.cd-env{color:#4FC1FF}.cd-fn{color:#DCDCAA}.cd-op{color:#D4D4D4;font-weight:700}.cd-key{color:#9CDCFE}
.cd-h{color:#569CD6;font-weight:700}.cd-b{color:#E8E8E8;font-weight:700}
/* terminal */
.term{background:#0C0C0C;border-radius:12px;overflow:hidden;border:1px solid #2D2D2D;flex:0 0 auto}
.term-bar{display:flex;justify-content:space-between;padding:6px 14px;font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;
  color:#BDBDBD;border-bottom:1px solid #262626}
.term-sim{color:#777}
.term-body{position:relative;padding:10px 14px 12px}
.term-body pre{margin:0;font-family:var(--f-mono);font-size:clamp(12px,.98vw,14px);line-height:1.6;color:#CCCCCC;white-space:pre-wrap;word-break:break-word}
.term-p{color:#4EC9B0;font-weight:700}
.term .ok{color:#73C991}.term .ko{color:#F48771}
.term-body.oculta pre{filter:blur(7px);opacity:.4;user-select:none}
.term-body:not(.oculta) .term-revelar{display:none}
.term-revelar{position:absolute;inset:8px 12px;z-index:2;border:2px dashed var(--amarillo);border-radius:8px;background:rgba(20,20,20,.86);
  color:#FDE68A;font:700 13px var(--f-cuerpo);cursor:pointer}
.nb-wrap.ancho{grid-template-columns:minmax(0,2fr) minmax(240px,1fr)}
/* capturas altas (menú lateral, diálogos) */
.shot-box img{max-height:calc(100vh - 330px)}
/* aislar el editor de los estilos de tabla de la plantilla */
.ed-code tbody td,.ed-code td{padding:0;border:0;background:transparent;color:#D4D4D4;font-weight:400;white-space:normal}
.ed-code tbody tr:nth-child(even) td,.ed-code tbody tr:hover td{background:transparent}
.ed-code tbody td.ln{color:#6E7681;font-weight:400;white-space:nowrap;padding:0 14px 0 10px}
.ed-code tbody td.lc{white-space:pre-wrap;padding-right:14px}
.ed-code tbody tr.res td{background:rgba(253,200,0,.13)}
.ed-code tbody tr.res td.ln{color:var(--amarillo)}
.ed-code tbody tr:hover td.lc{background:rgba(255,255,255,.04)}
.shot-fig{height:100%;min-height:0;overflow:hidden}
.shot-box{max-height:none}
.shot-box img{max-height:none}
.lightbox{position:fixed;inset:0;z-index:999;background:rgba(6,18,32,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:zoom-out;padding:24px}
.lightbox img{max-width:94vw;max-height:86vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.lightbox span{color:#C9D3DC;font:600 12px var(--f-mono);letter-spacing:.15em;text-transform:uppercase}

/* ---------- Responsivo ---------- */
@media (max-width:960px){
  header.marco,footer.marco{padding-left:22px;padding-right:22px}
  #escenario{padding:6px 22px 14px}
  .grid.c3,.grid.c2{grid-template-columns:1fr}
  .grid{overflow:auto}
  .slide.quiz .contenido{flex-direction:column;align-items:stretch;gap:20px;overflow:auto}
  .quiz-izq{flex:none}
  .clasif-grid{grid-template-columns:1fr!important}
  .tag-derecha{display:none}
  footer .seccion-pie{display:none}
  .shot-wrap,.nb-wrap,.nb-wrap.ancho{grid-template-columns:1fr;overflow:auto}
  .nb-texto{grid-template-columns:1fr}
}
</style>
</head>

readme:
`# Proyecto Películas IUD

API RESTful para el **Sistema de Gestión de Películas y Series** de la IU Digital de Antioquia.
Orientada al rol Administrador para la gestión y cargue de contenidos.

## Stack
Node.js 20.19+ · Express 5 · MongoDB Atlas · Mongoose 9 · ES Modules

## Requisitos previos
- Node.js 20.19 o superior y npm
- Git
- Una cuenta y un cluster en MongoDB Atlas

## Instalación y configuración
1. Clonar el repositorio y entrar a la carpeta \`backend/\`
2. Instalar dependencias con \`npm install\`
3. Copiar \`.env.template\` como \`.env\` y completar PORT y MONGODB_URI

## Ejecución
- Desarrollo: \`npm run dev\`
- Producción: \`npm start\`

## Endpoints principales
| Método | Ruta              | Descripción        |
| GET    | /api/v1/genres    | Lista los géneros  |
| POST   | /api/v1/genres    | Crea un género     |`,

readmeArq:
`## Arquitectura (MVC)

\`\`\`
backend/
├── index.js               # Punto de entrada: conexión, seeds y arranque
├── package.json / node_modules
├── app.js                 # Configuración de Express y montaje de rutas
├── configdb/database.js   # Conexión asíncrona a MongoDB Atlas
├── models/                # Modelos Mongoose (*.model.js) y validaciones
├── controllers/           # Lógica de negocio (*.controller.js)
└── routes/                # Definición de endpoints (*.routes.js)
\`\`\``,

database:
`import mongoose from 'mongoose';

export const connectDB = async () => {
  const uri = process.env.MONGODB_URI;
  if (!uri) {
    throw new Error('La variable de entorno MONGODB_URI no está definida');
  }
  await mongoose.connect(uri);
  console.log('✅ Conectado a MongoDB Atlas');
};`,

model:
`import { Schema, model } from 'mongoose';

const genreSchema = new Schema(
  {
    name: {
      type: String,
      required: [true, 'El nombre es obligatorio'],
      trim: true,
      unique: true,
    },
    status: { type: String, enum: ['Activo', 'Inactivo'], default: 'Activo' },
    description: { type: String, trim: true },
  },
  { timestamps: true, versionKey: false }
);

export const Genre = model('Genre', genreSchema);`,

controller:
`import { Genre } from '../models/genre.model.js';

export const getGenres = async (req, res) => {
  try {
    const genres = await Genre.find();
    res.json(genres);
  } catch (error) {
    res.status(500).json({ message: 'Error al consultar los géneros' });
  }
};

export const createGenre = async (req, res) => {
  try {
    const genre = await Genre.create(req.body);
    res.status(201).json(genre);
  } catch (error) {
    res.status(400).json({ message: error.message });
  }
};`,

routes:
`import { Router } from 'express';
import { getGenres, createGenre } from '../controllers/genre.controller.js';

const router = Router();

router.get('/', getGenres);
router.post('/', createGenre);

export default router;`,

app:

import genreRoutes from './routes/genre.routes.js';

const app = express();

app.use(cors());
app.use(express.json());

app.use('/api/v1/genres', genreRoutes);

export default app;`,

import app from './app.js';
import { connectDB } from './configdb/database.js';

const PORT = process.env.PORT || 3000;

const start = async () => {
  try {
    await connectDB();
    app.listen(PORT, () => {
      console.log(\`🚀 Servidor escuchando en http://localhost:\${PORT}\`);
    });
  } catch (error) {
    console.error('❌ No se pudo iniciar el servidor:', error.message);
    process.exit(1);
  }
};

start();`,

{ tipo:'pregunta', seccion:'Presentación',
  eyebrow:'Para empezar · Preguntas orientadoras',
  titulo:'¿Por qué importan <i>las convenciones?</i>',
  bajada:'Discutan en parejas dos minutos y compartan. Los criterios de orientación se abren después de escuchar al grupo.',
  preguntas:[
    {q:'Si el código funciona, ¿qué importa cómo se llamen las carpetas, los archivos o las variables?', a:'El código se escribe una vez y se <b>lee muchas veces</b>, por otras personas o por uno mismo semanas después. Las convenciones reducen el tiempo de comprensión, evitan errores entre sistemas operativos y facilitan el trabajo en equipo.'},
    {q:'¿Qué información debería poder deducir alguien con solo mirar el nombre de un archivo?', a:'Qué <b>recurso</b> trata (usuario, género, película) y qué <b>papel</b> cumple (ruta, controlador, modelo). Por eso usamos nombres como <code>genre.controller.js</code>.'},
    {q:'¿Qué datos de un proyecto <b>nunca</b> deberían quedar públicos en GitHub?', a:'Contraseñas, cadenas de conexión, llaves de API y cualquier secreto. También carpetas regenerables como <code>node_modules/</code>. Lo veremos con <code>.env</code> y <code>.gitignore</code>.'},

{ tipo:'quiz', seccion:'Bloque 1 · Convenciones de nombres',
  eyebrow:'Caso real',
  titulo:'¿Por qué <i>falla en producción?</i>',
  k:'Diagnostica',
  pregunta:'Un controlador importa "../models/Genre.model.js", pero el archivo se llama genre.model.js. En el portátil con Windows todo funciona; al desplegar en un servidor Linux aparece ERR_MODULE_NOT_FOUND. ¿Cuál es la causa?',
  opciones:[
    'El servidor Linux no tiene instalado Mongoose.',
    'Linux distingue mayúsculas de minúsculas: Genre.model.js y genre.model.js son archivos distintos.',
    'Los archivos de modelos deben terminar en .ts en producción.',
    'Falta ejecutar npm run dev en el servidor.',
  ],
  correcta:1,
  fbOk:'¡Exacto! Windows ignoró la diferencia de mayúsculas; Linux no. Nombrar todo en minúscula y escribir los imports exactamente igual evita el problema.',
  fbMal:'Las dependencias no son el problema: el archivo existe, pero con otro uso de mayúsculas. Linux distingue Genre de genre; Windows no.' },

{ tipo:'pregunta', seccion:'Bloque 1 · Convenciones de nombres',
  eyebrow:'Análisis crítico del proyecto real',
  titulo:'¿El proyecto cumple <i>sus propias reglas?</i>',
  bajada:'Observen estos tres detalles tomados del Proyecto Películas IUD. No hay una única respuesta: lo importante es argumentar.',
  preguntas:[
    {q:'La carpeta de conexión se llama <code>configdb/</code>. Según la convención, ¿está bien? ¿Cómo la nombrarías?', a:'Es válida (minúscula, una sola «palabra»), pero junta dos palabras sin separador. Siguiendo la regla quedaría <code>config/</code> o <code>database-config/</code>. Lo importante es la <b>consistencia</b>: si se cambia, hay que actualizar todos los imports.'},
    {q:'La carpeta raíz es <code>Proyecto-Peliculas-IUD</code>, pero en <code>package.json</code> el nombre es <code>proyecto-peliculas-iud</code>. ¿Por qué la diferencia?', a:'npm <b>exige</b> nombres de paquete en minúscula, sin espacios. La carpeta raíz admite mayúsculas, pero usar el mismo nombre en kebab-case en ambos lugares (y en el repositorio de GitHub) es más coherente.'},
    {q:'La guía para escribir el README pone como ejemplo de endpoint <code>POST /api/generos</code>, en español y sin versión. ¿Qué problema genera mezclar idiomas?', a:'Las URLs, carpetas y archivos están en inglés (<code>genre.routes.js</code>). Mezclar idiomas confunde: el equipo debe acordar <b>un idioma</b> para el código. La forma coherente sería <code>POST /api/v1/genres</code>.'},
  ],
  docente:'Valore los argumentos más que la «respuesta correcta». El objetivo es que identifiquen que una convención solo funciona si se aplica de manera consistente.' },

  function encabezado(sl){

  const escHTML = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const PY_TOKENS = /(#[^\n]*)|("[^"\n]*"?|'[^'\n]*'?)|\b(\d+(?:\.\d+)?)\b|\b(print|input|int|float|str|type)\b(?=\s*\()|\b(if|elif|else|for|while|import|from|def|return|class|True|False|None|and|or|not|in)\b|(=)/g;
  function hlPy(code){
    let out='', last=0, m;
    PY_TOKENS.lastIndex=0;
    while((m=PY_TOKENS.exec(code))){
      out += escHTML(code.slice(last, m.index));
      const cls = m[1]?'cm':m[2]?'st':m[3]?'nu':m[4]?'fn':m[5]?'kw':'op';
      out += `<span class="py-${cls}">${escHTML(m[0])}</span>`;
      last = PY_TOKENS.lastIndex;

    return out + escHTML(code.slice(last));

  const HL = {

           ['cm','st','kw','nu','env','fn','op']],
    json: [/("[^"\n]*")(?=\s*:)|("[^"\n]*")|\b(true|false|null)\b|\b(\d+(?:\.\d+)?)\b/g, ['key','st','kw','nu']],
    env:  [/^(#[^\n]*)|^([A-Z_][A-Z0-9_]*)(?==)|(=)/gm, ['cm','key','op']],
    md:   [/^(#{1,6} [^\n]*)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)|^(```[^\n]*)|([├└│]──?|──)|(#[^\n#]*)$/gm, ['h','b','st','cm','op','cm']],
    git:  [/^(#[^\n]*)|(\*|\/)/gm, ['cm','op']],

  function hlCode(code, lang){

        return `<div class="nb-cell nb-codigo">
          <div class="nb-in">
            <span class="nb-n">[${c.n}]</span>
            <button class="nb-run" data-c="${i}" title="${c.oculta?'Revelar el resultado':'Celda ejecutada'}" aria-label="Ejecutar celda">▶</button>
            <pre class="nb-code">${hlPy(c.code)}</pre>
          </div>
          ${tieneSalida?`<div class="nb-out ${c.error?'err':''} ${c.oculta?'oculta':''}" data-o="${i}">
            ${c.oculta?`<button class="nb-revelar" data-c="${i}">🤔 Predice primero · luego haz clic para revelar el resultado</button>`:''}
            <pre>${fmtSalida(c.salida)}</pre></div>`:''}
        </div>`;
      };
      return `<div class="slide"><div class="contenido">${encabezado(sl)}
        <div class="nb-wrap">
          <div class="nb">
            <div class="nb-bar"><span class="nb-ico">▣</span><b>${sl.archivo||'cuaderno.ipynb'}</b><span class="nb-sim">simulación</span></div>
            <div class="nb-body">${sl.celdas.map(celda).join('')}</div>
          </div>
          <div class="nb-notas">
            ${sl.notas.map(n=>`<article class="nb-nota"><div class="k">${n.k}</div><h4>${n.t}</h4><p>${n.p}</p></article>`).join('')}
          </div>
        </div></div></div>`;
    },

    /* ---- Preguntas orientadoras con criterios para el docente ---- */
    pregunta(sl, idx){
      return `<div class="slide"><div class="contenido">${encabezado(sl)}
        <div class="preg-lista">
          ${sl.preguntas.map((p,i)=>`<article class="preg">
            <div class="preg-q"><span class="preg-n">${i+1}</span><p>${p.q}</p></div>
            <button class="preg-btn" data-p="${i}">Ver criterios de orientación</button>
            <div class="preg-a" id="pa-${idx}-${i}">${p.a}</div>
          </article>`).join('')}
        </div></div></div>`;
    },

    /* ---- Editor de código (estilo VS Code) con terminal opcional ---- */
    editor(sl, idx){
      const archivos = sl.archivos || [{archivo:sl.archivo, ruta:sl.ruta, lang:sl.lang, code:sl.code, resaltar:sl.resaltar}];
      const pane = a => {
        const res = new Set(a.resaltar||[]);
        const lineas = hlCode(a.code, a.lang).split('\n');
        return `<div class="ed">
          <div class="ed-tabs"><span class="ed-tab"><i class="ed-ico ed-${a.lang}"></i>${a.archivo}</span></div>
          ${a.ruta?`<div class="ed-ruta">${a.ruta}</div>`:''}
          <div class="ed-body"><table class="ed-code">${lineas.map((l,i)=>`<tr class="${res.has(i+1)?'res':''}"><td class="ln">${i+1}</td><td class="lc">${l||' '}</td></tr>`).join('')}</table></div>
        </div>`;
      };
      const t = sl.terminal;
      const term = t ? `<div class="term ${t.error?'err':''}">
          <div class="term-bar"><span>TERMINAL</span><span class="term-sim">simulación</span></div>
          <div class="term-body ${t.oculta?'oculta':''}" data-t="1">
            ${t.oculta?`<button class="term-revelar">🤔 Predice qué mostrará la terminal · clic para revelar</button>`:''}
            <pre><span class="term-p">$</span> ${escHTML(t.cmd)}\n${escHTML(t.salida).replace(/^(✅[^\n]*|🚀[^\n]*)$/gm,'<span class="ok">$1</span>').replace(/^(❌[^\n]*|Error[^\n]*|\w*Error:[^\n]*)$/gm,'<span class="ko">$1</span>')}</pre>
          </div></div>` : '';
      return `<div class="slide"><div class="contenido">${encabezado(sl)}
        <div class="nb-wrap ${sl.ancho?'ancho':''}">
          <div class="ed-col">${archivos.map(pane).join('')}${term}</div>
          <div class="nb-notas">
            ${(sl.notas||[]).map(n=>`<article class="nb-nota"><div class="k">${n.k}</div><h4>${n.t}</h4><p>${n.p}</p></article>`).join('')}
          </div>
        </div></div></div>`;
    },

    cierre(sl){
      const quizzes = SLIDES.filter(s=>s.tipo==='quiz').length;
      const aciertos = Object.keys(respuestas).filter(k=>!String(k).startsWith('_') && respuestas[k]).length;
      const contestados = Object.keys(respuestas).filter(k=>!String(k).startsWith('_')).length;
      const msg = contestados===0 ? 'Aún no respondiste ningún quiz.'
        : aciertos===quizzes ? '¡Puntaje perfecto! Tu criterio de buenas prácticas está afinado.'
        : aciertos>=Math.ceil(quizzes*0.6) ? '¡Buen trabajo! Repasa las secciones donde fallaste.'
        : 'Vale la pena repasar la sesión: usa el índice para volver a los bloques clave.';
      return `<div class="slide seccion">${encabezado(sl)}
        <div class="marcador">
          <div class="stat"><b>${aciertos}/${quizzes}</b><span>Aciertos en quizzes</span></div>
          <div class="stat"><b>${contestados}</b><span>Quizzes respondidos</span></div>
          <div class="stat"><b>${SLIDES.length}</b><span>Diapositivas</span></div>
        </div>
        <p class="bajada" style="margin-top:26px"><b style="color:var(--amarillo)">${msg}</b></p>
      </div>`;
    }
  };

  /* ---- Mostrar diapositiva ---- */
  function mostrar(n){
    actual = Math.max(0, Math.min(SLIDES.length-1, n));
    const sl = SLIDES[actual];
    document.body.dataset.tipo = sl.tipo;
    escenario.innerHTML = render[sl.tipo](sl, actual);

    /* quiz: conectar opciones */
    if(sl.tipo==='quiz'){
      const ops = escenario.querySelectorAll('.opcion');
      const fb = escenario.querySelector('#fb-'+actual);
      const yaResp = respuestas.hasOwnProperty(actual);
      if(yaResp){ pintarQuiz(ops, sl, respuestas['_sel'+actual], fb); }
      ops.forEach(b=>b.addEventListener('click', ()=>{
        if(respuestas.hasOwnProperty(actual)) return;
        const i = +b.dataset.i;
        respuestas[actual] = (i===sl.correcta);
        respuestas['_sel'+actual] = i;
        pintarQuiz(ops, sl, i, fb);
      }));
    }

    /* clasificación: conectar tarjetas */
    if(sl.tipo==='clasifica'){
      escenario.querySelectorAll('.clasif-card').forEach(card=>{
        const key = actual + ':' + card.dataset.c;
        const btns = card.querySelectorAll('.clasif-btn');
        const res = card.querySelector('.clasif-res');
        const pintar = sel=>{
          btns.forEach(b=>{
            const i = +b.dataset.i; b.disabled = true;
            if(i === +card.dataset.ok) b.classList.add('ok');
            else if(i === sel) b.classList.add('mal');
          });
          const ok = sel === +card.dataset.ok;
          res.textContent = (ok ? (sl.fbOk||'¡Correcto!') : (sl.fbMal||'La categoría correcta quedó marcada en verde.')) + (card.dataset.fb ? ' ' + card.dataset.fb : '');
          res.classList.add('visible', ok ? 'bien' : 'error');
        };
        if(clasif.hasOwnProperty(key)) pintar(clasif[key]);
        btns.forEach(b=>b.addEventListener('click', ()=>{
          if(clasif.hasOwnProperty(key)) return;
          clasif[key] = +b.dataset.i; pintar(clasif[key]);
        }));
      });
    }

    /* reflexión: conservar lo escrito al navegar */
    if(sl.tipo==='reflexion'){
      escenario.querySelectorAll('textarea[data-nk]').forEach(t=>{
        const k = t.dataset.nk;
        if(notas[k]) t.value = notas[k];
        t.addEventListener('input', ()=>{ notas[k] = t.value; });
      });
    }

    /* captura anotada: resaltar zona y nota correspondientes */
    if(sl.tipo==='pantallazo'){
      /* ajustar la captura al espacio disponible para que las zonas coincidan */
      const fig = escenario.querySelector('.shot-fig'), img = fig.querySelector('img');
      const fit = ()=>{ const h = fig.clientHeight; if(h>80) img.style.maxHeight = h+'px'; };
      if(img.complete) fit(); else img.addEventListener('load', fit);
      if(window.ResizeObserver) new ResizeObserver(fit).observe(fig);
      /* clic en la captura: verla ampliada */
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', ()=>{
        const lb = document.createElement('div'); lb.className = 'lightbox';
        lb.innerHTML = `<img src="${img.src}" alt="${img.alt}"><span>Clic o Esc para cerrar</span>`;
        const cerrar = ()=>{ lb.remove(); document.removeEventListener('keydown', esc, true); };
        const esc = e=>{ if(e.key==='Escape'){ e.stopPropagation(); cerrar(); } };
        lb.addEventListener('click', cerrar); document.addEventListener('keydown', esc, true);
        document.body.appendChild(lb);
      });
      const activar = z=>{
        escenario.querySelectorAll('[data-z]').forEach(el=>
          el.classList.toggle('activa', el.dataset.z===String(z) && !el.classList.contains('activa-fija')));
      };
      escenario.querySelectorAll('[data-z]').forEach(el=>{
        el.addEventListener('click', ()=>activar(el.dataset.z));
        el.addEventListener('mouseenter', ()=>activar(el.dataset.z));
      });
    }

    /* cuaderno: revelar salidas ocultas (predicción) */
    if(sl.tipo==='cuaderno'){
      const revelar = i=>{
        const o = escenario.querySelector(`.nb-out[data-o="${i}"]`);
        if(o){ o.classList.remove('oculta'); revelados[actual+':'+i]=true; }
      };
      Object.keys(revelados).forEach(k=>{ const [s,i]=k.split(':'); if(+s===actual) revelar(i); });
      escenario.querySelectorAll('.nb-run,.nb-revelar').forEach(b=>
        b.addEventListener('click', ()=>revelar(b.dataset.c)));
    }

    /* preguntas: mostrar / ocultar criterios */
    if(sl.tipo==='pregunta'){
      escenario.querySelectorAll('.preg-btn').forEach(b=>b.addEventListener('click', ()=>{
        const a = escenario.querySelector(`#pa-${actual}-${b.dataset.p}`);
        const abierto = a.classList.toggle('visible');
        b.textContent = abierto ? 'Ocultar criterios' : 'Ver criterios de orientación';
      }));
    }

    /* nota para el docente (opcional en cada diapositiva) */
    if(sl.docente){
      const slideEl = escenario.querySelector('.slide');
      slideEl.insertAdjacentHTML('beforeend',
        `<details class="nota-docente"><summary>Orientación para el docente</summary><div>${sl.docente}</div></details>`);
    }

    /* editor: revelar salida de terminal */
    if(sl.tipo==='editor'){
      const tb = escenario.querySelector('.term-body.oculta');
      if(tb){
        if(revelados[actual+':t']) tb.classList.remove('oculta');
        tb.querySelector('.term-revelar').addEventListener('click', ()=>{ tb.classList.remove('oculta'); revelados[actual+':t']=true; });
      }
    }

    /* pie y progreso */
    $('#pie-centro').textContent = sl.seccion || '';
    $('#pie-der').innerHTML = `<b>${String(actual+1).padStart(2,'0')}</b> / ${SLIDES.length}`;
    $('#progreso-fill').style.width = ((actual+1)/SLIDES.length*100)+'%';
    location.hash = 's'+(actual+1);
  }

  function pintarQuiz(ops, sl, sel, fb){
    ops.forEach(b=>{
      const i = +b.dataset.i;
      b.disabled = true;
      if(i===sl.correcta) b.classList.add('correcta');
      else if(i===sel) b.classList.add('incorrecta');
    });
    const ok = sel===sl.correcta;
    fb.className = 'feedback visible ' + (ok?'ok':'mal');
    fb.textContent = ok ? sl.fbOk : sl.fbMal;
  }

  /* ---- Índice ---- */
  const indice = $('#indice');
  function abrirIndice(){
    const grupos = {};
    SLIDES.forEach((s,i)=>{ (grupos[s.seccion]=grupos[s.seccion]||[]).push({i,s}); });
    indice.innerHTML = `<h2>Índice <i>de la sesión</i></h2>
      <div class="ayuda">Clic para saltar · ESC para cerrar · ← → para navegar</div>` +
      Object.entries(grupos).map(([g,arr])=>`
        <div class="ind-grupo"><h4>${g}</h4><ol>
          ${arr.map(({i,s})=>`<li><button data-i="${i}" class="${i===actual?'actual':''}">
            <span>${String(i+1).padStart(2,'0')}</span>${s.titulo.replace(/<[^>]+>/g,'')}
          </button></li>`).join('')}
        </ol></div>`).join('');
    indice.classList.add('abierto');
    indice.querySelectorAll('button[data-i]').forEach(b=>
      b.addEventListener('click',()=>{ cerrarIndice(); mostrar(+b.dataset.i); }));
  }
  function cerrarIndice(){ indice.classList.remove('abierto'); }
  indice.addEventListener('click', e=>{ if(e.target===indice) cerrarIndice(); });

  /* ---- Controles ---- */
  $('#b-prev').addEventListener('click', ()=>mostrar(actual-1));
  $('#b-next').addEventListener('click', ()=>mostrar(actual+1));
  $('#b-indice').addEventListener('click', ()=> indice.classList.contains('abierto')?cerrarIndice():abrirIndice());
  $('#b-full').addEventListener('click', ()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });

  document.addEventListener('keydown', e=>{
    if(indice.classList.contains('abierto') && e.key==='Escape') return cerrarIndice();
    if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); mostrar(actual+1); }
    else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); mostrar(actual-1); }
    else if(e.key==='Home') mostrar(0);
    else if(e.key==='End') mostrar(SLIDES.length-1);
    else if(e.key.toLowerCase()==='m' || e.key.toLowerCase()==='i')
      indice.classList.contains('abierto')?cerrarIndice():abrirIndice();
    else if(e.key.toLowerCase()==='f') $('#b-full').click();
  });

  /* ---- Gestos táctiles ---- */
  let x0=null;
  escenario.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; },{passive:true});
  escenario.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx)>60) mostrar(actual + (dx<0?1:-1));
    x0=null;
  },{passive:true});

  /* ---- Arranque (respeta #sN en la URL) ---- */
  const h = location.hash.match(/^#s(\d+)$/);
  mostrar(h ? (+h[1]-1) : 0);
})();
</script>
</body>
